<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VYRON</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VYRON">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e8590c">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mut:#6b6a66;--line:#e4e2db;--acc:#e8590c;--ok:#2f9e44;--accbg:#fff0e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--card:#222220;--ink:#f1f0ec;--mut:#9c9a93;--line:#34332f;--acc:#ff8a4c;--ok:#51cf66;--accbg:#3a2a20;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151514;--card:#222220;--ink:#f1f0ec;--mut:#9c9a93;--line:#34332f;--acc:#ff8a4c;--ok:#51cf66;--accbg:#3a2a20;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.hero{display:flex;gap:16px;align-items:center;justify-content:space-between}
.big{font-size:34px;font-weight:700;line-height:1.1}
.mut{color:var(--mut);font-size:13px}
.lvl{flex:1;max-width:190px}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 3px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .3s}
h2{font-size:15px;margin:18px 2px 8px;color:var(--mut);font-weight:600}
.task{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 12px;margin-bottom:8px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;font:inherit;text-align:left;cursor:pointer}
.ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--acc);display:grid;place-items:center;color:#fff;font-weight:700}
.tt{flex:1}
.xp{font-size:12px;color:var(--acc);background:var(--accbg);padding:2px 8px;border-radius:9px}
.task.done{opacity:.55}.task.done .ck{background:var(--ok);border-color:var(--ok)}.task.done .tt{text-decoration:line-through}
.win{background:var(--accbg);border-color:var(--acc);text-align:center;font-weight:600}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:110px;resize:vertical}
.btn{display:block;width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:none;color:var(--mut);border:1px solid var(--line);margin-top:8px;padding:8px;font-weight:500}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat b{display:block;font-size:26px}
.chart{display:flex;align-items:flex-end;gap:8px;height:110px}
.col{flex:1;text-align:center;font-size:12px;color:var(--mut)}
.col div{background:var(--acc);border-radius:6px 6px 0 0;min-height:4px;margin-bottom:4px}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.bd{padding:6px 12px;border-radius:20px;border:1px solid var(--line);font-size:13px;opacity:.4}.bd.on{opacity:1;background:var(--accbg);border-color:var(--acc)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:12px;padding:6px;cursor:pointer}
nav button.on{color:var(--acc);font-weight:700}
nav span{display:block;font-size:20px}
.brand{text-align:center;font-weight:800;letter-spacing:.35em;font-size:15px;margin:2px 0 12px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
#toast.show{opacity:1}
</style></head><body>
<div class="wrap"><div id="app"></div></div>
<nav id="nav"></nav><div id="toast"></div>
<script>
const KEY="discipline_v1";
let S={projects:[],done:{},xp:0},tab="today",arm=null,tm;
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const add=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const DEF=["Clarifier l’objectif et le résultat attendu","Rassembler le matériel et les ressources","Produire un premier brouillon","Améliorer et corriger","Finaliser et livrer"];

function tasksFor(p,date){
  const D=diff(p.start,p.end)+1,d=diff(p.start,date);
  if(d<0||d>=D)return[];
  const n=p.steps.length,a=Math.floor(d*n/D),b=Math.floor((d+1)*n/D),main=[];
  if(b>a){for(let i=a;i<b;i++)main.push(p.steps[i])}
  else main.push("Avancer sur : "+p.steps[Math.min(a,n-1)]);
  const k=p.id+"|"+date+"|";
  return[{id:k+"s",t:"Démarrage : 5 minutes, pas plus",xp:5,main:false,p:p.name},
    ...main.map((t,i)=>({id:k+"m"+i,t,xp:20,main:true,p:p.name})),
    {id:k+"b",t:"Bilan : 1 minute pour noter ce qui est fait",xp:5,main:false,p:p.name}];
}
const dayTasks=d=>S.projects.flatMap(p=>tasksFor(p,d));
const hasMain=d=>dayTasks(d).some(t=>t.main);
const valid=d=>{const m=dayTasks(d).filter(t=>t.main);return m.length>0&&m.every(t=>S.done[t.id])};
const first=()=>S.projects.reduce((m,p)=>!m||p.start<m?p.start:m,null);

function streak(){
  const f=first();if(!f)return 0;
  let n=0,d=today();if(!valid(d))d=add(d,-1);
  for(let i=0;i<700&&d>=f;i++,d=add(d,-1)){if(!hasMain(d))continue;if(valid(d))n++;else break}
  return n;
}
function best(){
  const f=first();if(!f)return 0;
  let run=0,bst=0,t=today();
  for(let d=f;d<=t;d=add(d,1)){
    if(!hasMain(d))continue;
    if(valid(d)){run++;bst=Math.max(bst,run)}else if(d!==t)run=0;
  }
  return bst;
}
function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("show");clearTimeout(tm);tm=setTimeout(()=>e.classList.remove("show"),2200)}

function tg(id,xp){
  const t=today(),was=valid(t);
  if(S.done[id]){delete S.done[id];S.xp=Math.max(0,S.xp-xp)}
  else{S.done[id]=1;S.xp+=xp;toast("+"+xp+" XP")}
  save();render();
  if(!was&&valid(t))toast("Journée validée ! Série : "+streak()+" 🔥");
}
function addProject(){
  const name=$("#pn").value.trim(),end=$("#pe").value;
  const steps=$("#ps").value.split("\n").map(s=>s.trim()).filter(Boolean);
  if(!name)return toast("Donne un nom à ton projet");
  if(!end||end<today())return toast("Choisis une date de fin à partir d’aujourd’hui");
  S.projects.push({id:"p"+Date.now().toString(36),name,start:today(),end,steps:steps.length?steps:DEF.slice()});
  save();tab="today";render();toast("Plan prêt. Premier pas : 5 minutes.");
}
function del(id){
  if(arm!==id){arm=id;render();return}
  S.projects=S.projects.filter(p=>p.id!==id);arm=null;save();render();
}
const go=t=>{tab=t;arm=null;render();window.scrollTo(0,0)};

function row(t){const d=!!S.done[t.id];
  return`<button class="task ${d?"done":""}" onclick="tg('${t.id}',${t.xp})"><span class="ck">${d?"✓":""}</span><span class="tt">${esc(t.t)}</span><span class="xp">+${t.xp}</span></button>`}
function group(list){
  const g={};list.forEach(t=>(g[t.p]=g[t.p]||[]).push(t));
  return Object.keys(g).map(k=>`<h2>${esc(k)}</h2>`+g[k].map(row).join("")).join("");
}
function hero(){
  const st=streak(),l=Math.floor(S.xp/100)+1;
  return`<div class="card hero"><div><div class="big">🔥 ${st}</div><div class="mut">jour${st>1?"s":""} de série</div></div>
  <div class="lvl"><b>Niveau ${l}</b><div class="bar"><i style="width:${S.xp%100}%"></i></div><div class="mut">${S.xp%100}/100 XP</div></div></div>`;
}
function viewToday(){
  if(!S.projects.length)return`<div class="card"><b>Bienvenue.</b><p class="mut">Saisis un projet et une date de fin : tu recevras un plan quotidien très petit, pensé pour que tu ne lâches pas.</p><button class="btn" onclick="go('proj')">Créer mon premier projet</button></div>`;
  const t=today(),list=dayTasks(t),all=list.length,dn=list.filter(x=>S.done[x.id]).length;
  const y=add(t,-1),late=dayTasks(y).filter(x=>x.main&&!S.done[x.id]);
  let h=`<div class="card"><b>Aujourd’hui</b> <span class="mut">${dn}/${all} tâches</span><div class="bar"><i style="width:${all?dn/all*100:0}%"></i></div></div>`;
  if(valid(t))h+=`<div class="card win">Journée validée. Tu peux t’arrêter là, ou continuer.</div>`;
  if(!all)h+=`<div class="card mut">Rien de prévu aujourd’hui. Ajoute ou prolonge un projet.</div>`;
  h+=group(list);
  if(late.length)h+=`<h2>À rattraper (hier) : sans pression, ça compte quand même</h2>`+late.map(row).join("");
  return h;
}
function viewProj(){
  let h=`<div class="card"><b>Nouveau projet</b>
  <label>Nom du projet</label><input id="pn" placeholder="Ex. : rédiger mon rapport">
  <label>Date de fin</label><input id="pe" type="date" value="${add(today(),14)}">
  <label>Étapes (une par ligne, facultatif)</label><textarea id="ps" placeholder="Laisse vide pour un plan par défaut"></textarea>
  <button class="btn" onclick="addProject()">Générer mon plan</button></div>`;
  if(S.projects.length)h+=`<h2>Mes projets</h2>`;
  S.projects.forEach(p=>{
    const D=diff(p.start,p.end)+1,d=Math.min(Math.max(diff(p.start,today())+1,0),D);
    h+=`<div class="card"><b>${esc(p.name)}</b><div class="mut">Jour ${d}/${D} · fin le ${parse(p.end).toLocaleDateString("fr-FR")} · ${p.steps.length} étape${p.steps.length>1?"s":""}</div>
    <div class="bar"><i style="width:${d/D*100}%"></i></div>
    <button class="btn ghost" onclick="del('${p.id}')">${arm===p.id?"Confirmer la suppression ?":"Supprimer"}</button></div>`;
  });
  return h;
}
function viewStats(){
  const st=streak(),b=best(),cnt=Object.keys(S.done).length,l=Math.floor(S.xp/100)+1;
  let bars="",pd=0,pt=0;
  for(let i=6;i>=0;i--){
    const d=add(today(),-i),L=dayTasks(d),n=L.length,k=L.filter(x=>S.done[x.id]).length;
    pd+=k;pt+=n;
    bars+=`<div class="col"><div style="height:${n?Math.max(4,k/n*90):4}px;${n?"":"opacity:.25"}"></div>${parse(d).toLocaleDateString("fr-FR",{weekday:"narrow"})}</div>`;
  }
  const rate=pt?Math.round(pd/pt*100):0;
  const B=[["Premier pas",cnt>=1],["3 jours",b>=3],["7 jours",b>=7],["14 jours",b>=14],["30 jours",b>=30],["Niveau 5",l>=5]];
  return`<div class="grid"><div class="card stat"><span class="mut">Série actuelle</span><b>${st}</b></div><div class="card stat"><span class="mut">Meilleure série</span><b>${b}</b></div>
  <div class="card stat"><span class="mut">Tâches faites</span><b>${cnt}</b></div><div class="card stat"><span class="mut">Réussite 7 jours</span><b>${rate} %</b></div></div>
  <div class="card"><b>7 derniers jours</b><div class="chart" style="margin-top:12px">${bars}</div></div>
  <div class="card"><b>Badges</b><div class="badges" style="margin-top:10px">${B.map(x=>`<span class="bd ${x[1]?"on":""}">${x[0]}</span>`).join("")}</div></div>`;
}
function render(){
  $("#app").innerHTML=`<div class="brand">VYRON</div>`+hero()+(tab==="today"?viewToday():tab==="proj"?viewProj():viewStats());
  const N=[["today","✅","Aujourd’hui"],["proj","📁","Projets"],["stats","📊","Stats"]];
  $("#nav").innerHTML=N.map(n=>`<button class="${tab===n[0]?"on":""}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join("");
}
render();
</script></body></html>
